<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>种子萌发试验封存台</title><link rel="stylesheet" href="/static/app.css"></head>
<body>
<header><div><p class="eyebrow">GERMINATION ARCHIVE</p><h1>濒危植物种子萌发试验封存台</h1></div><span id="health" class="status">连接中</span></header>
<nav><button class="tab active" data-view="overview">总览</button><button class="tab" data-view="source">种源建档</button><button class="tab" data-view="trial">试验设计</button><button class="tab" data-view="work">观测与治理</button></nav>
<main>
 <section id="overview" class="view active"><div class="metrics"><article><span>种源</span><strong id="sourceCount">0</strong></article><article><span>试验</span><strong id="trialCount">0</strong></article><article><span>待裁决异常</span><strong id="issueCount">0</strong></article><article><span>已封存</span><strong id="frozenCount">0</strong></article></div><div class="section-head"><div><h2>试验档案</h2><p>选择一项进入观测、复核与封存流程</p></div><button class="icon refresh" title="刷新" aria-label="刷新">↻</button></div><div id="trialList" class="table-wrap"></div></section>
 <section id="source" class="view"><div class="section-head"><div><h2>登记种源档案</h2><p>采集信息和保藏条件将进入审计链</p></div></div><form id="sourceForm" class="form-grid"><label>植物学名<input name="ScientificName" required placeholder="例如 Taxus chinensis"></label><label>种源批次<input name="LotCode" required placeholder="LOT-2026-001"></label><label>采集地点<input name="CollectionLocation" required></label><label>采集人<input name="Collector" required></label><label>采集日期<input type="date" name="CollectionDate" required></label><label>保藏条件<input name="StorageCondition" required placeholder="4°C 干燥避光"></label><label>初始状态<select name="Status"><option value="active">可用</option><option value="inactive">停用</option><option value="archived">封存</option></select></label><div class="actions"><button type="submit" class="primary">保存种源</button></div></form><div id="sourceList" class="records"></div></section>
 <section id="trial" class="view"><div class="section-head"><div><h2>创建萌发试验</h2><p>配置重复组、恒温条件和阶段时间表</p></div></div><form id="trialForm" class="form-grid"><label>种源<select name="SourceID" id="sourceSelect" required></select></label><label>试验协议<input name="ProtocolName" required placeholder="ISTA 濒危种修订方案"></label><label>重复组数<input type="number" name="ReplicateCount" min="1" max="96" value="3" required></label><label>目标温度 °C<input type="number" name="TemperatureCelsius" step="0.1" value="22" required></label><label class="wide">观测时间表（逗号分隔）<input name="ObservationSchedule" value="第3天,第7天,第14天" required></label><div class="actions"><button type="submit" class="primary">建立试验</button></div></form></section>
 <section id="work" class="view"><div class="section-head"><div><h2>试验治理</h2><p id="selectedHint">请从总览选择试验</p></div><span id="trialState" class="badge"></span></div><div id="workspace" hidden><div id="designPlan" class="timeline"></div><div id="timeline" class="timeline"></div><div class="panel-grid"><form id="observationForm"><h3>录入阶段观测</h3><input type="hidden" name="ExpectedVersion"><label>观测时点<input name="ObservedAt" placeholder="第3天" required></label><div class="table-wrap"><table><thead><tr><th>重复组</th><th>发芽数</th><th>霉变数</th><th>温度 °C</th><th>湿度 %</th><th>证据索引</th></tr></thead><tbody id="observationRows"></tbody></table></div><button type="submit" class="primary">提交本阶段全部观测</button></form><div><h3>异常队列</h3><div id="issueQueue" class="records"></div><h3>整改清单</h3><div id="remediationList" class="records"></div></div></div><div class="panel-grid"><form id="reviewForm"><h3>同行复核</h3><input type="hidden" name="ExpectedVersion"><label>复核人<input name="Reviewer" required></label><label>结论<select name="State"><option value="approved">通过</option><option value="returned">退回整改</option></select></label><label>复核意见<textarea name="Comment" required></textarea></label><label>整改要求<textarea name="Remediation"></textarea></label><div id="remediationRows"></div><button type="button" id="addRemediation" title="添加整改项" aria-label="添加整改项">＋</button><button type="submit">提交复核</button></form><form id="freezeForm"><h3>冻结与签发</h3><input type="hidden" name="ExpectedVersion"><div id="archiveChecklist"></div><label>签发人<input name="Issuer" required></label><button type="submit" class="danger">冻结试验并签发凭据</button><div id="certificate"></div></form></div></div></section>
</main><div id="toast" role="status"></div><script src="/static/app.js"></script></body></html>
